name: Refresh visuals

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_visuals.py
      - .github/workflows/visuals.yml

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Render public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: Myosotis11037
        run: python3 scripts/update_visuals.py
      - name: Save updated visuals
        run: |
          git add assets/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile visuals'
          git push
